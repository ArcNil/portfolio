[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

; Runs the postgres image's own entrypoint script with "postgres" as the
; argument -- this is what triggers its normal first-run init (creating
; the data dir, user, db) before it execs postgres in the foreground.
[program:postgres]
command=docker-entrypoint.sh postgres
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err.log

[program:tunnel]
command=/usr/local/bin/tunnel.sh
priority=10
autostart=true
autorestart=true
startretries=999
stdout_logfile=/var/log/tunnel.log
stderr_logfile=/var/log/tunnel.err.log

[program:fastapi]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 7860
directory=/app
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/fastapi.log
stderr_logfile=/var/log/fastapi.err.log
