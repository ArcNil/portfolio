[project]
name = "portfolio-workers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ArcNil", email = "arcn----@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.54.0",
]

[project.scripts]
dev = "portfolio_workers.app:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "uvicorn>=0.54.0",
]
